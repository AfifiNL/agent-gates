# Template: copy to .github/workflows/gate.yml in the repository you want to protect.
#
# What it gates. On `pull_request` it checks out the pull request's HEAD commit (not GitHub's
# synthetic merge ref), so the result belongs to a commit you can name. That is not yet the
# commit that will land on main. On `merge_group` (GitHub's merge queue) it checks out the
# queue's candidate merge commit: that is the exact commit main will move to. So:
#   * turn on the merge queue for main, and
#   * make the `gate` job (and the others you keep) REQUIRED for the queue in branch
#     protection or a ruleset.
#
# What it cannot do. On `pull_request`, GitHub runs the workflow file from the pull request
# itself, and the job runs the pull request's Makefile and tests. A pull request can therefore
# edit this file or the checks it calls. The protection comes from (1) the checks being
# REQUIRED by protected configuration (branch protection / rulesets, or an organisation-level
# required workflow that pull requests cannot change), (2) code review of changes to this file
# and the Makefile, and (3) the merge-queue run on the candidate commit.
#
# CodeQL and dependency review are free on public repositories; on private repositories they
# need GitHub Advanced Security (code scanning / dependency graph). Remove those jobs if you do
# not have it. Every action is pinned by full commit SHA; the comment names the release.
name: gate

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (tests and checks on the exact commit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record the commit under test
        run: echo "Gated commit $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"
      - name: Project checks (same command as local)
        run: make check

  secret-scan:
    name: secret scan (gitleaks, full repository history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (release binary, checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "$base/$file"
          echo "${GITLEAKS_SHA256}  $file" | sha256sum -c -
          tar -xzf "$file" gitleaks
      - name: Scan
        run: ./gitleaks git . --redact --no-banner --exit-code 1

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: python
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
