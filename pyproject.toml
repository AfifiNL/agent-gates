[project]
name = "agent-gates"
version = "0.1.0"
description = "Gates for AI coding agents on a git repository: written specs with acceptance criteria, one worktree per lane, a gate run on the exact commit, a merge queue that only moves main to gated commits, and a numbered decision log."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Hossam Afifi" }]
dependencies = [
    "mcp>=2.3.0,<3",
]

[project.urls]
Repository = "https://github.com/AfifiNL/agent-gates"

[project.scripts]
agent-gates = "agent_gates.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_gates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agent_gates"]
mypy_path = "src"
